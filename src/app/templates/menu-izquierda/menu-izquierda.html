<p-menu [model]="items" [styleClass]="menuWidth">
  <ng-template #start>
    <span class="inline-flex items-center gap-1 px-2 py-2">
      <span class="text-xl font-semibold" [innerHTML]="menuTitle"></span>
    </span>
  </ng-template>
  <ng-template #submenuheader let-item>
    <span class="text-primary font-bold">{{ item.label }}</span>
  </ng-template>
  <ng-template #item let-item>
    <!-- Item con routerLink (navegación interna) -->
    <a
      *ngIf="item.routerLink && !item.items && item.visible !== false"
      pRipple
      class="flex items-center p-menu-item-link"
      [routerLink]="item.routerLink"
      routerLinkActive="active-route"
      [routerLinkActiveOptions]="
        item.routerLinkActiveOptions || {
          paths: 'exact',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored',
        }
      "
      [fragment]="item.fragment"
      [queryParamsHandling]="item.queryParamsHandling"
      [preserveFragment]="item.preserveFragment"
      [skipLocationChange]="item.skipLocationChange"
      [replaceUrl]="item.replaceUrl"
      [state]="item.state"
      [queryParams]="item.queryParams"
      [attr.target]="item.target"
      [ngClass]="item.styleClass"
      (click)="itemClick($event, item)"
    >
      <span [class]="item.icon"></span>
      <span class="ml-2">{{ item.label }}</span>

      @if (item.badge) {
        <p-badge class="ml-auto" [value]="item.badge" />
      }

      @if (item.shortcut) {
        <span
          class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1"
        >
          {{ item.shortcut }}
        </span>
      }
    </a>

    <!-- Item sin routerLink (URL externa o comando) -->
    <a
      *ngIf="(!item.routerLink || item.items) && item.visible !== false"
      pRipple
      class="flex items-center p-menu-item-link"
      [attr.href]="item.url"
      [attr.target]="item.target"
      [ngClass]="item.styleClass"
      (click)="itemClick($event, item)"
    >
      <span [class]="item.icon"></span>
      <span class="ml-2">{{ item.label }}</span>

      @if (item.badge) {
        <p-badge class="ml-auto" [value]="item.badge" />
      }

      @if (item.shortcut) {
        <span
          class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1"
        >
          {{ item.shortcut }}
        </span>
      }
    </a>
  </ng-template>
  <ng-template #end>
    @if (footerContent) {
      <div class="px-2 py-2 border-t border-gray-200">
        <span [innerHTML]="footerContent"></span>
      </div>
    }
  </ng-template>
</p-menu>
